            - generic [ref=e139]: "01"
            - heading "Webdesign" [level=3] [ref=e140]
          - paragraph [ref=e141]: Maßgeschneiderte Websites statt Baukasten. Jede Fläche, jede Schrift, jeder Abstand ist eine Entscheidung — getroffen für Ihre Marke, nicht für eine Vorlage.
        - generic [ref=e143]:
          - generic [ref=e144]:
            - generic [ref=e145]: "02"
            - heading "Entwicklung" [level=3] [ref=e146]
          - paragraph [ref=e147]: "Moderne Technik unter der Haube: Next.js, TypeScript, Bestwerte bei Ladezeit und Suchmaschinen. Schön allein reicht nicht — es muss laufen."
        - generic [ref=e149]:
          - generic [ref=e150]:
            - generic [ref=e151]: "03"
            - heading "Grafikdesign & Branding" [level=3] [ref=e152]
          - paragraph [ref=e153]: Logo, Typografie, Farbwelt. Eine visuelle Identität, die auf dem Bildschirm genauso funktioniert wie auf dem Plakat.
        - generic [ref=e155]:
          - generic [ref=e156]:
            - generic [ref=e157]: "04"
            - heading "Betreuung" [level=3] [ref=e158]
          - paragraph [ref=e159]: Nach dem Livegang fängt die Arbeit an. Neue Inhalte, Updates, Weiterentwicklung — Ihre Website bleibt so gut, wie sie am ersten Tag war.
    - generic [ref=e161]:
      - heading "So arbeite ich" [level=2] [ref=e163]
      - generic [ref=e165]:
        - generic [ref=e166]:
