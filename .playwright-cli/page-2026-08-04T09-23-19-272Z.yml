          - heading "Verstehen" [level=3] [ref=e168]
          - paragraph [ref=e169]: Ihre Marke, Ihre Ziele, Ihr Publikum. Erst zuhören, dann gestalten.
        - generic [ref=e170]:
          - paragraph [ref=e171]: "02"
          - heading "Konzept" [level=3] [ref=e172]
          - paragraph [ref=e173]: Struktur, Inhalte, Tonalität — ein klarer Plan, bevor der erste Entwurf entsteht.
        - generic [ref=e174]:
          - paragraph [ref=e175]: "03"
          - heading "Design & Umsetzung" [level=3] [ref=e176]
          - paragraph [ref=e177]: Vom Entwurf zum fertigen Produkt, in kurzen Abstimmungsschleifen. Sie sehen früh, was entsteht.
        - generic [ref=e178]:
          - paragraph [ref=e179]: "04"
          - heading "Launch & Begleitung" [level=3] [ref=e180]
          - paragraph [ref=e181]: "Sauberer Livegang auf Ihrer Domain. Danach: messbare Ergebnisse und ein Ansprechpartner, der bleibt."
    - generic [ref=e183]:
      - heading "Profil" [level=2] [ref=e184]
      - paragraph [ref=e186]: "Ich arbeite an der Schnittstelle von Grafik und Code: Als Grafiker denke ich in Marken und Flächen, als Entwickler in Systemen und Details."
      - paragraph [ref=e187]: Das Ergebnis sind Websites aus einem Guss — gestaltet und gebaut von einer Hand, ohne Reibungsverluste zwischen Agentur, Designer und Entwickler. Aus Berlin, für Kunden von hier bis Georgien.
